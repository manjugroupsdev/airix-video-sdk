name: Web SDK checks
on: [push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, airix-sdk-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run test:types
      - run: npm run test:artifacts
      - run: npm audit --omit=dev --audit-level=high
