name: Web SDK checks
on:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: web-sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor == 'manjugroupsdev'
    runs-on: [self-hosted, linux, x64, airix-sdk-ci]
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run test:types
      - run: npm run test:artifacts
      - run: node --test scripts/*.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --prefix examples/video-demo --ignore-scripts
      - run: npm run build --prefix examples/video-demo
      - name: Pack exact checked release
        run: node scripts/release.mjs pack "$RUNNER_TEMP/sdk-release" "$GITHUB_SHA"
      - name: Detect approved main release plan
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          [[ "$BEFORE" =~ ^[a-f0-9]{40}$ ]] && [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]]
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- release-plan.json scripts/release.mjs scripts/registry-consumer.mjs | grep -Eq '^(release-plan.json|scripts/release.mjs|scripts/registry-consumer.mjs)$'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-release-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'manjugroupsdev' && needs.verify.outputs.publish == 'true'
    runs-on: [self-hosted, linux, x64, airix-sdk-ci]
    timeout-minutes: 15
    steps:
      - name: Reject superseded release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const main = await github.rest.repos.getCommit({ ...context.repo, ref: 'main' });
            if (main.data.sha !== context.sha) core.setFailed('A newer main commit exists; release is stale.');
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-release-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-publish/
          digest-mismatch: error
      - name: Publish only the verified tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs publish "$RUNNER_TEMP/sdk-publish" "$GITHUB_SHA"
      - name: Verify registry-only consumer
        run: bash scripts/check-registry-consumer.sh
